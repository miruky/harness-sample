[project]
name = "booking"
version = "0.1.0"
description = "会議室予約のCLI。AIエージェント向けハーネスの見本リポジトリの題材"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
booking = "booking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booking"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# 標準出力へ書いてよいのはCLIの入口だけ
"src/booking/cli.py" = ["T20"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
