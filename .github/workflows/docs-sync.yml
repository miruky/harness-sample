name: docs-sync

on:
  push:
    paths: ["docs/specs/**", "tools/docs_sync.py"]
  pull_request:
    paths: ["docs/specs/**", "tools/docs_sync.py"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # 接続先を登録していないリポジトリ（フォークなど）では動かさない
    if: vars.CONFLUENCE_BASE_URL != ''
    env:
      CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
      CONFLUENCE_SPACE: ${{ vars.CONFLUENCE_SPACE }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # push のたびに書き込む。レビューの指摘で直して push し直したときも、ここで追いつく
      - if: github.event_name == 'push'
        run: uv run python tools/docs_sync.py push
      # ページを全文取得して、ローカルの Markdown と一致するかを確かめる
      - run: uv run python tools/docs_sync.py verify
